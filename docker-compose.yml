services:
  api:
    build: .
    image: torque-verify-api
    ports:
      # 宿主端口由 API_PORT 环境变量覆盖，默认 8000
      - "${API_PORT:-8000}:8000"
    volumes:
      # 校准档案 SQLite 库持久化到命名卷，容器重建不丢档案
      - calibration-data:/srv/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：先跑 pytest，再对 api 服务做黑盒验收，随后退出
  verify:
    image: torque-verify-api
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      # 与 api 服务同一 SQLite 文件：验收末尾以全新仓库实例重开该文件，
      # 模拟服务重启后核对作废证据与重算结果一致
      RESTART_DB_PATH: /srv/app/data/calibration.db
    volumes:
      # 挂入同一命名卷：验收末尾以全新仓库实例重开同一 SQLite 文件
      # （只读用途，但 WAL 需要写 -wal/-shm，故不能只读挂载），
      # 模拟服务重启后核对作废证据与重算结果一致
      - calibration-data:/srv/app/data
    command: ["sh", "-c", "python -m pytest -q && python -m verify.acceptance"]
    restart: "no"

volumes:
  calibration-data:
